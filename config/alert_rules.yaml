alerts:
  - name: high_latency_p95
    severity: warning
    condition: p95(latency_ms) > 3000 trong 5 phút
    type: symptom-based
    owner: dashboard-team
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2 trong 5 phút
    type: symptom-based
    owner: dashboard-team
    runbook: docs/alerts.md#alert-2
  - name: low_quality_score
    severity: warning
    condition: mean(quality_score) < 0.75 trong 15 phút
    type: symptom-based
    owner: dashboard-team
    runbook: docs/alerts.md#alert-3
